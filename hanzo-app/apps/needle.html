<!--hz {"title":"Regex","archetype":"devtool","creator":"data","desc":"Regular expression workbench: live highlighting of every match, named and numbered capture groups, flags, replace preview, a cheatsheet and a library of ready patterns.","nav":[["#/","Tester"]]} -->
<div class="row" style="margin-bottom:12px">
  <h1 style="margin:0">Regex</h1><span class="tag" id="stat">—</span>
  <span class="spacer"></span><span id="flags" class="row" style="gap:4px"></span>
</div>
<div class="split r">
  <div class="col">
    <div class="pane"><header>Pattern</header><div class="body">
      <div class="inline"><span class="mono muted">/</span>
        <input id="re" spellcheck="false" style="font-family:var(--mono)" value="(?<key>[a-z_]+)\s*=\s*(?<val>&quot;[^&quot;]*&quot;|\d+)">
        <span class="mono muted" id="fl">/gm</span></div>
      <div class="field" style="margin-top:10px"><label>Replacement (use $1, $&lt;name&gt;)</label>
        <input id="rep" spellcheck="false" style="font-family:var(--mono)" value="$<key>: $<val>"></div>
    </div></div>
    <div class="pane"><header>Subject</header><div class="body">
      <textarea id="sub" spellcheck="false" style="min-height:150px;font-family:var(--mono);font-size:12.5px"></textarea>
    </div></div>
    <div class="pane"><header>Highlighted matches</header><div class="body"><pre id="hi" style="white-space:pre-wrap"></pre></div></div>
    <div class="pane"><header>Replace preview</header><div class="body"><pre id="out" style="white-space:pre-wrap"></pre></div></div>
  </div>
  <div class="col">
    <div class="pane"><header>Matches</header><div id="list" style="max-height:300px;overflow:auto"></div></div>
    <div class="pane"><header>Pattern library</header><ul class="list" id="lib"></ul></div>
    <div class="pane"><header>Cheatsheet</header><ul class="list" id="cheat"></ul></div>
  </div>
</div>
<script>
const {h,fill,$,store,esc,toast,submit} = hz;
const SUBJECT = `# deploy.conf
slug   = "my-app"
region = "sfo3"
files  = 412
retain = 30
domain = "my-app.hanzo.app"
# contacts
ops@example.invalid, sre@example.invalid
2026-07-14T09:30:00Z  GET /v1/sites 200 12ms
2026-07-14T09:30:04Z  POST /v1/sites/deploy 200 240ms
2026-07-14T09:31:11Z  GET /missing 404 3ms`;
const LIB = [
  ['Key = value pairs','(?<key>[a-z_]+)\\s*=\\s*(?<val>"[^"]*"|\\d+)','gm'],
  ['Email addresses','[\\w.+-]+@[\\w-]+\\.[\\w.]+','g'],
  ['ISO-8601 timestamps','\\d{4}-\\d{2}-\\d{2}T[\\d:]+Z','g'],
  ['HTTP log lines','(?<method>GET|POST|PUT|DELETE)\\s(?<path>\\S+)\\s(?<status>\\d{3})','g'],
  ['Non-2xx statuses','\\s(?<status>[45]\\d{2})\\s','g'],
  ['Quoted strings','"([^"\\\\]|\\\\.)*"','g'],
  ['Duplicate words','\\b(\\w+)\\s+\\1\\b','gi'],
];
const CHEAT = [['\\d','digit'],['\\w','word character'],['\\s','whitespace'],['[^x]','anything but x'],
  ['a|b','a or b'],['x*','zero or more'],['x+','one or more'],['x?','optional'],['x{2,4}','2 to 4'],
  ['(?<n>…)','named group'],['(?:…)','non-capturing'],['(?=…)','lookahead'],['^ $','line anchors (with m)']];
const flags = store('regex.flags', {g:true,m:true,i:false,s:false,u:false});
$('#sub').value = SUBJECT;

function flagStr(){ return Object.entries(flags.get()).filter(([,v])=>v).map(([k])=>k).join(''); }
function drawFlags(){
  fill($('#flags'), Object.keys(flags.get()).map(k=>h('button.sm'+(flags.get()[k]?' p':''),
    {onclick:()=>{flags.set(v=>({...v,[k]:!v[k]}));drawFlags();run();}}, k)));
  $('#fl').textContent = '/'+flagStr();
}
function run(){
  const src = $('#re').value, sub = $('#sub').value;
  let re;
  try { re = new RegExp(src, flagStr()); }
  catch(e){ $('#stat').textContent='invalid'; $('#stat').className='tag bad';
    fill($('#list'), h('div.empty', e.message)); $('#hi').textContent = sub; return; }
  const ms = [...sub.matchAll(flags.get().g ? re : new RegExp(src, flagStr()+'g'))];
  $('#stat').textContent = ms.length+' match'+(ms.length===1?'':'es');
  $('#stat').className = 'tag '+(ms.length?'ok':'warn');
  // highlight
  let out='', at=0;
  ms.forEach((m,i)=>{ out += esc(sub.slice(at,m.index));
    out += '<mark style="background:'+(i%2?'#8b5cf655':'#5b8cff55')+';color:inherit;border-radius:3px">'+esc(m[0])+'</mark>';
    at = m.index + m[0].length; });
  out += esc(sub.slice(at));
  $('#hi').innerHTML = out || '<span class="muted">no subject</span>';
  fill($('#list'), ms.length ? h('table',
    h('thead',h('tr',h('th','#'),h('th','At'),h('th','Match'),h('th','Groups'))),
    h('tbody', ms.slice(0,60).map((m,i)=>h('tr',
      h('td.num',i+1), h('td.num.small.muted',m.index),
      h('td.mono.small',m[0].slice(0,40)),
      h('td.small', m.groups ? Object.entries(m.groups).map(([k,v])=>h('span.tag.acc',k+'='+String(v).slice(0,14)))
        : m.slice(1).map((g,j)=>h('span.tag','$'+(j+1)+'='+String(g).slice(0,14))))))))
    : h('div.empty','No matches'));
  try { $('#out').textContent = sub.replace(re, $('#rep').value); }
  catch(e){ $('#out').textContent = '(replacement error)'; }
}
['#re','#sub','#rep'].forEach(s=>$(s).addEventListener('input', run));
fill($('#lib'), LIB.map(([n,p,f])=>h('li',{style:{cursor:'pointer'},
  onclick:()=>{ $('#re').value=p;
    flags.set(v=>Object.fromEntries(Object.keys(v).map(k=>[k,f.includes(k)])));
    drawFlags(); run(); submit('regex.pattern',{name:n}).catch(()=>{}); toast('Pattern loaded'); }},
  h('div',{style:{minWidth:0}},h('div.small.b',n),h('div.mono.small.muted.trunc',p)))));
fill($('#cheat'), CHEAT.map(([a,b])=>h('li',h('span.mono.small.b',{style:{width:'74px'}},a),h('span.small.muted',b))));
drawFlags(); run();
</script>
